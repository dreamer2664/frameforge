<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style>
<script type="importmap">
{"imports":{
"three":"/node_modules/three/build/three.module.js",
"three/addons/":"/node_modules/three/examples/jsm/",
"troika-three-text":"/node_modules/troika-three-text/dist/troika-three-text.esm.js",
"troika-three-utils":"/node_modules/troika-three-utils/dist/troika-three-utils.esm.js",
"troika-worker-utils":"/node_modules/troika-worker-utils/dist/troika-worker-utils.esm.js",
"webgl-sdf-generator":"/node_modules/webgl-sdf-generator/dist/webgl-sdf-generator.mjs",
"bidi-js":"/node_modules/bidi-js/dist/bidi.mjs"
}}
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { Text } from 'troika-three-text';

const W = 1080, H = 1920;
const renderer = new THREE.WebGLRenderer({antialias:true, preserveDrawingBuffer:true});
renderer.setSize(W, H, false);
renderer.setPixelRatio(1);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x07070b);
scene.fog = new THREE.Fog(0x07070b, 8, 26);

const camera = new THREE.PerspectiveCamera(38, W/H, 0.1, 100);
camera.position.set(0, 0.4, 7.2);
camera.lookAt(0,0,0);

const knot = new THREE.Mesh(
  new THREE.TorusKnotGeometry(1.5, 0.55, 220, 36),
  new THREE.MeshStandardMaterial({color:0x9aa0b5, metalness:1.0, roughness:0.22})
);
scene.add(knot);

const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(60, 60),
  new THREE.MeshStandardMaterial({color:0x0b0b10, metalness:0.9, roughness:0.32})
);
floor.rotation.x = -Math.PI/2; floor.position.y = -2.6;
scene.add(floor);

const l1 = new THREE.PointLight(0xff6b35, 260, 40, 2); l1.position.set(4.2, 3.2, 3.4); scene.add(l1);
const l2 = new THREE.PointLight(0x2b4fd8, 220, 40, 2); l2.position.set(-4.6, 1.8, 2.6); scene.add(l2);
const l3 = new THREE.PointLight(0x7fe8ff, 120, 40, 2); l3.position.set(0, 5.5, -3.5); scene.add(l3);
scene.add(new THREE.AmbientLight(0x1a1c28, 1.6));

const txt = new Text();
txt.text = 'kinetic.';
txt.fontSize = 0.9;
txt.color = 0xf2eee6;
txt.font = '/fonts/Inter-SemiBold.ttf';
txt.position.set(-1.85, -1.55, 2.2);
txt.rotation.x = -0.12;
scene.add(txt);
txt.sync();

window.__seek = (t) => {
  knot.rotation.x = 0.6 + t*0.35;
  knot.rotation.y = t*0.55;
  const z = 0.35*Math.sin(t*0.8);
  camera.position.set(Math.sin(t*0.22)*1.1, 0.4 + Math.cos(t*0.3)*0.35, 7.2 + z);
  camera.lookAt(0, 0, 0);
  renderer.render(scene, camera);
};

window.__ready = true;
window.__shot = () => renderer.domElement.toDataURL('image/jpeg', 0.93);
</script>
</body>
</html>
